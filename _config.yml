title: Conference on Parsimony and Learning (CPAL)
description: >-
  The Fourth Conference on Parsimony and Learning (CPAL 2027),
  March 23–26, 2027, at Hitotsubashi Hall in Tokyo, Japan.
domain: cpal.cc
url: "https://cpal.cc"
baseurl: ""
repository: conf-parsimonyandlearning/cpal-website

theme: just-the-docs
color_scheme: cpal
logo: "/assets/images/logo.svg"
favicon_ico: "/assets/favicon.svg"

search_enabled: true
heading_anchors: true
permalink: pretty
nav_sort: case_insensitive
aux_links_new_tab: false
aux_links:
  "Registration":
    - "/registration/"
  "CPAL OpenReview":
    - "/openreview/"

gh_edit_link: false
last_edit_timestamp: false

callouts:
  announcement:
    title: Announcement
    color: blue
  important:
    title: Important
    color: yellow
  forthcoming:
    title: Forthcoming
    color: grey-lt

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CONTENT_STATUS.md
  - CONTRIBUTING.md
  - docs
  - vendor
  - README_INTERNAL.md
  - CLAUDE.md
  - scripts
  - MIGRATION.md
  - _db
  - assets/todo
