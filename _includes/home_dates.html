<table>
  <thead><tr><th scope="col">Event</th><th scope="col">Deadline (AoE)</th></tr></thead>
  <tbody>
    {% assign deadline_keys = "abstract,proceedings,spotlight" | split: "," %}
    {% for key in deadline_keys %}
    {% assign deadline = site.data.paper_deadlines[key] %}
    <tr><th scope="row">{{ deadline.label }}</th><td><strong>{{ deadline.date }}</strong></td></tr>
    {% endfor %}
  </tbody>
</table>
