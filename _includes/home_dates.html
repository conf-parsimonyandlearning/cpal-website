<ul class="home-date-cards" aria-label="Important submission dates">
  {% assign deadline_keys = "abstract,proceedings,spotlight" | split: "," %}
  {% for key in deadline_keys %}
  {% assign deadline = site.data.paper_deadlines[key] %}
  <li class="home-date-card">
    <span class="home-date-label">{{ deadline.label }}</span>
    <strong class="home-date-value">{{ deadline.date }}</strong>
  </li>
  {% endfor %}
</ul>
