<section class="home-committee">
  <h2>Conference leadership</h2>
  <div class="leadership-row">
    {% assign leaders = site.data.organizers | where: "role_key", "general" %}
    {% for person in leaders %}
      <a class="leadership-pill" href="{{ person.website }}" target="_blank" rel="noopener">
        <span>{{ person.name }}</span>
        <small>General Chair</small>
      </a>
    {% endfor %}
  </div>
  <p><a href="{{ '/organization_committee/' | relative_url }}">View the full CPAL 2027 organizing committee →</a></p>
</section>
